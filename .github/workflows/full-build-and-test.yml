name: full build and test

on:
  workflow_dispatch:
  push:
    branches:
      - 3_refactor_ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hucebot/opensot/opensot-test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
            source /opt/ros/jazzy/setup.bash
            source /home/forest_ws/setup.bash
            mkdir build && cd build
            cmake -DCMAKE_INSTALL_PREFIX:STRING=/home/forest_ws/install \
                -DCMAKE_BUILD_TYPE:STRING=Release \
                -DOPENSOT_COMPILE_TESTS=True \
                ..
            make -j$(nproc)
            cmake --install .

      - name: Test c++
        shell: bash
        run: |
            source /opt/ros/jazzy/setup.bash
            source /home/forest_ws/setup.bash
            cd build
            ctest --output-on-failure

      - name: Test python
        shell: bash
        run: |
            source /opt/ros/jazzy/setup.bash
            source /home/forest_ws/setup.bash
            cd ./bindings/python
            pytest .

