[build-system]
requires = ["scikit-build-core>=0.8", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "pyopensot"
version = "5.0.0"
description = "openSoT python"
requires-python = ">=3.10"
dependencies = [
    "numpy<=1.26.4",
    "opensot_model_interface>=5.0,<5.1"
]

[project.optional-dependencies]
viser = ["viser<=1.0.26", "yourdfpy", "h5py", "scipy"]
resources = ["pyopensot-resources"]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
cmake.define = { OPENSOT_COMPILE_EXAMPLES = "OFF", OPENSOT_COMPILE_TESTS = "OFF" }
build-dir = "build/{wheel_tag}"
wheel.packages = []

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"

